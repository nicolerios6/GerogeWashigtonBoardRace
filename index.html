<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Race to Philadelphia: Washington’s Presidency</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Source+Sans+3:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6EAF1; --surface:#FFFFFF; --ink:#1A1F2B; --muted:#4A5468;
  --navy:#1F2A44; --navy-2:#2B3A5E; --brass:#C9A227; --road:#CBD2DE; --road-line:#FFFFFF;
  --red:#9B2335; --good:#2E7D4F; --good-bg:#DDF0E4; --bad-bg:#F6DDE1; --line:#C3CBD8;
  color-scheme: light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121725; --surface:#1C2335; --ink:#ECEFF5; --muted:#AAB3C5;
    --navy:#3A4E7E; --navy-2:#30416A; --brass:#D9B53F; --road:#2C3550; --road-line:#4A5674;
    --red:#D0566A; --good:#5BC489; --good-bg:#1D3A2A; --bad-bg:#43202A; --line:#38425A; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121725; --surface:#1C2335; --ink:#ECEFF5; --muted:#AAB3C5;
  --navy:#3A4E7E; --navy-2:#30416A; --brass:#D9B53F; --road:#2C3550; --road-line:#4A5674;
  --red:#D0566A; --good:#5BC489; --good-bg:#1D3A2A; --bad-bg:#43202A; --line:#38425A; color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:18px;line-height:1.45;min-height:100vh}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--brass);outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:3px double var(--line);padding-bottom:12px;margin-bottom:14px}
header.top h1{margin:0;font-family:"IM Fell English SC",Georgia,serif;font-weight:400;font-size:clamp(28px,4.4vw,48px);line-height:1.05}
header.top p{margin:4px 0 0;color:var(--muted);font-size:16px;max-width:60ch}
.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);padding:8px 14px;border-radius:6px;font-size:15px;font-weight:600}
.ghost:hover{border-color:var(--ink)}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--red);border-radius:8px;padding:6px 14px;display:flex;align-items:baseline;gap:10px}
.stat.alt{border-left-color:var(--navy)}
.stat .n{font-weight:700;color:var(--muted);font-size:15px}
.stat .s{font-weight:900;font-size:24px;font-variant-numeric:tabular-nums}
.board{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:16px;overflow-x:auto}
.board svg{display:block;width:100%;min-width:620px;height:auto}
.place{font-family:"IM Fell English SC",Georgia,serif;fill:var(--ink)}
.small{font-family:"Source Sans 3",system-ui,sans-serif;font-weight:700;fill:var(--muted)}
#token{transition:transform .6s ease}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:clamp(18px,3vw,30px);max-width:980px;margin:0 auto}
.q .meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-weight:700;margin-bottom:8px;flex-wrap:wrap}
.q .meta .tag{color:var(--red)}
.q h2{font-weight:700;font-size:clamp(21px,2.6vw,30px);line-height:1.25;margin:0 0 16px;max-width:48ch}
.q .hint{color:var(--muted);margin:-6px 0 14px;font-weight:600}
.excerpt{border-left:4px solid var(--brass);background:var(--bg);padding:12px 16px;margin:0 0 16px;font-style:italic;max-width:70ch}
.excerpt cite{display:block;font-style:normal;color:var(--muted);font-size:15px;margin-top:6px}
.choices{display:grid;gap:10px;margin-bottom:16px}
.choice{display:flex;gap:14px;align-items:flex-start;text-align:left;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:8px;padding:11px 16px;font-size:clamp(17px,1.9vw,20px)}
.choice:hover:not(:disabled){border-color:var(--navy)}
.choice .k{flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:900;font-size:16px}
.choice.right{border-color:var(--good);background:var(--good-bg)}
.choice.right .k{background:var(--good)}
.choice.wrong{border-color:var(--red);background:var(--bad-bg)}
.choice.wrong .k{background:var(--red)}
.choice:disabled{cursor:default}
.feedback{border-radius:8px;padding:14px 16px;margin-bottom:16px;background:var(--bg);border:1px solid var(--line)}
.feedback strong{display:block;font-size:20px;margin-bottom:4px}
.feedback.ok strong{color:var(--good)}
.feedback.no strong{color:var(--red)}
.primary{background:var(--red);color:#fff;border:0;border-radius:6px;padding:12px 24px;font-weight:700;font-size:18px}
.primary:hover{filter:brightness(1.08)}
.end{text-align:center;padding:10px 16px 0}
.end h2{font-family:"IM Fell English SC",Georgia,serif;font-weight:400;font-size:clamp(34px,5vw,54px);margin:0 0 8px}
.end p{color:var(--muted);font-size:20px;margin:0 0 18px}
.review{max-width:820px;margin:24px auto 0;text-align:left}
.review h3{font-family:"IM Fell English SC",Georgia,serif;font-weight:400;font-size:26px;margin:0 0 10px}
.review ol{margin:0;padding-left:22px}
.review li{margin-bottom:14px}
.review .ans{color:var(--good);font-weight:700}
.review .why{color:var(--muted)}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){#token{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Race to Philadelphia</h1>
      <p>Help President Washington travel from Mount Vernon to the capital. A correct answer moves you forward one space. A wrong answer sends you back one space.</p>
    </div>
    <button class="ghost" id="restart">Start over</button>
  </header>
  <div class="stats">
    <div class="stat"><span class="n">Space</span><span class="s" id="space">0 / 16</span></div>
    <div class="stat alt"><span class="n">Right on first try</span><span class="s" id="first">0</span></div>
    <div class="stat alt"><span class="n">Sent back</span><span class="s" id="back">0</span></div>
  </div>
  <div class="board"><svg id="svg" viewBox="0 0 1000 330" role="img" aria-label="Game board from Mount Vernon to Philadelphia"></svg></div>
  <div id="qView"></div>
  <div class="end" id="endView" hidden></div>
</div>

<script>
const QS = [
 {cat:"Farewell Address",q:"What advice did Washington give the nation in his Farewell Address?",c:["Avoiding strong ties with other nations is the best foreign policy.","Waging war with others will show the nation’s power and dominance.","Having separate political parties is the key to a successful democracy.","Encouraging the government to borrow money will lead to economic growth."],a:0,why:"Washington told the nation to steer clear of permanent alliances and keep political ties with foreign nations to a minimum."},
 {cat:"Farewell Address",q:"According to George Washington, what was one danger of forming political parties?",c:["They would make presidential elections easier.","They could divide the country and allow foreign influence into American politics.","They would help unite states with different economies.","They would help the U.S. form stronger international alliances."],a:1,why:"He warned that “the spirit of party” stirs up jealousy between Americans and opens the door to foreign influence and corruption."},
 {cat:"Farewell Address",q:"Which of the following were main points George Washington made in his Farewell Address about how America should move forward?",c:["Factionalism (political parties) would divide America, and political unity was needed for an efficient federal government","Permanent foreign entanglements should be avoided, and neutrality in foreign affairs was the right course","All of the above","None of the above"],a:2,why:"Both are core messages of the Farewell Address: avoid political parties and avoid permanent foreign alliances."},
 {cat:"Farewell Address",q:"Washington wanted Americans to take pride in being called what, more than any title from their state or region?",excerpt:{text:"“The name of American… must always exalt the just pride of patriotism more than any title derived from local discriminations.”",cite:"George Washington, Farewell Address, 1796"},c:["Virginians, New Yorkers, and so on","Americans","Federalists or Republicans","British citizens"],a:1,why:"Washington wanted people to see themselves as united Americans first, not divided by state, region, or party."},
 {cat:"Firsts & the Cabinet",q:"Alexander Hamilton held which position in George Washington’s presidential cabinet?",c:["Secretary of State","Secretary of the Treasury"],a:1,why:"Hamilton ran the Treasury. Thomas Jefferson was Secretary of State."},
 {cat:"Firsts & the Cabinet",q:"Which TWO people were members of George Washington’s presidential cabinet?",c:["Benjamin Franklin and Samuel Adams","Thomas Jefferson and Alexander Hamilton","Henry Clay and Thomas Jefferson","Samuel Adams and Alexander Hamilton"],a:1,why:"Jefferson (Secretary of State) and Hamilton (Secretary of the Treasury) both served in Washington’s cabinet."},
 {cat:"Firsts & the Cabinet",q:"By choosing not to seek a third term, Washington demonstrated the leadership quality of…",c:["honesty and a sense of personal integrity","courage in the midst of difficult circumstances","personal restraint from seeking power","sacrifice and civic responsibility to the country"],a:2,why:"Stepping down after two terms showed he would not hold on to power. The two-term tradition lasted until FDR."},
 {cat:"Firsts & the Cabinet",q:"President Washington set many precedents. Which THREE are correct?",hint:"Pick the group with all three correct precedents.",c:["First to be called “Your Majesty,” first to serve two terms, first to form a political party","Recommended the title “Mr. President,” first to serve two terms, first to appoint cabinet members","First to form a political party, first to appoint cabinet members, first to be called “Your Majesty”","Recommended the title “Mr. President,” first to form a political party, first to serve two terms"],a:1,why:"Washington accepted “Mr. President,” served two terms, and created the first cabinet. He refused royal titles and never joined a party."},
 {cat:"Foreign Policy",q:"George Washington’s foreign policy emphasized ____. He attempted to ____ U.S. involvement in the military affairs of other nations.",c:["Intervention … Expand","Alliance … Maintain","Neutrality … Limit","Neutrality … Expand"],a:2,why:"Washington’s policy was neutrality, and he tried to limit U.S. involvement in other nations’ wars."},
 {cat:"Foreign Policy",q:"In 1793, Washington issued the Proclamation of Neutrality to keep the U.S. out of a war between which two nations?",excerpt:{text:"“The duty and interest of the United States require that they should… pursue a conduct friendly and impartial toward the belligerent powers.”",cite:"George Washington, Proclamation of Neutrality, 1793"},c:["Spain and Portugal","France and Britain","Britain and Spain","France and the Netherlands"],a:1,why:"The Proclamation kept the U.S. out of the war between France and Britain."},
 {cat:"Foreign Policy",q:"As president, George Washington attempted to remain neutral in the war between Britain and France because…",c:["most Americans supported the British","both France and Britain traded with the United States","most Americans supported the French","the British were encouraging Native Americans to attack settlers"],a:1,why:"The U.S. depended on trade with both nations, so taking a side would have hurt the young country’s economy."},
 {cat:"Foreign Policy",q:"How did Washington’s Farewell Address influence the foreign policies of U.S. presidents in the early years of the United States?",c:["They attempted to remain neutral","They worked to repair relations with Britain","They cut funding for overseas military actions","They isolated the United States by using embargoes"],a:0,why:"Presidents after Washington followed his advice and tried to stay neutral in European conflicts."},
 {cat:"Challenges at Home",q:"Which problem did George Washington encounter when he became president?",c:["Southern states were threatening to secede from the Union.","The United States had large debts from the American Revolution.","Great Britain was refusing to trade with the United States.","The Articles of Confederation needed to be replaced with a stronger constitution."],a:1,why:"The nation owed huge war debts. Hamilton’s financial plan was designed to pay them off and build national credit."},
 {cat:"Challenges at Home",q:"Hamilton or Jefferson: Who feared the National Bank had too much British influence and argued the Constitution did not give Congress the power to create one (strict interpretation)?",c:["Hamilton","Jefferson"],a:1,why:"Jefferson read the Constitution strictly. Hamilton used a loose reading (the “necessary and proper” clause) to support the bank."},
 {cat:"Challenges at Home",q:"The Whiskey Rebellion challenged the idea that…",c:["the federal government had the power to pass and enforce tax laws","a national military was needed for dealing with foreign threats","the federal government could raise tariffs to protect industries","a national court system was needed for resolving disputes between states"],a:0,why:"Farmers rebelled against a federal tax on whiskey. Washington sent troops, proving the new government could enforce its laws."},
 {cat:"Challenges at Home",q:"Which idea from Washington’s Farewell Address most influenced U.S. foreign policy in the early 1800s?",c:["The need to end slavery across the United States.","The creation of strong political parties to guide voters.","The importance of staying neutral in foreign conflicts and avoiding permanent alliances.","The requirement for every citizen to serve in the military."],a:2,why:"Neutrality and avoiding permanent alliances shaped U.S. foreign policy for decades."}
];
const GOAL=16, LETTERS="ABCD", KEY="gw-board-race-v1";
const STOPS={0:"Mount Vernon",3:"Alexandria",7:"Baltimore",12:"Wilmington",16:"Philadelphia"};
const $=id=>document.getElementById(id);
const NS="http://www.w3.org/2000/svg";
function esc(s){return String(s).replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]))}
function fresh(){return{pos:0,deck:QS.map((_,i)=>i),first:{},missed:[],back:0}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&Array.isArray(s.deck))return s}catch(e){}return null}
let state=load()||fresh(), pts=[];

function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e}
function buildBoard(){
  const svg=$("svg");svg.innerHTML="";
  const d="M70 250 C 200 250 210 80 340 80 S 480 250 610 250 S 760 80 880 80 S 940 200 930 240";
  el("path",{d,fill:"none",stroke:"var(--road)","stroke-width":46,"stroke-linecap":"round"},svg);
  const path=el("path",{d,fill:"none",stroke:"var(--road-line)","stroke-width":3,"stroke-dasharray":"10 12"},svg);
  const L=path.getTotalLength();
  pts=[];for(let i=0;i<=GOAL;i++){const p=path.getPointAtLength(L*i/GOAL);pts.push([p.x,p.y])}
  pts.forEach(([x,y],i)=>{
    const g=el("g",{id:"node"+i},svg);
    const end=i===0||i===GOAL;
    el("circle",{cx:x,cy:y,r:end?20:15,"stroke-width":3},g);
    if(i>0&&i<GOAL){const t=el("text",{x,y:y+5,"text-anchor":"middle","font-size":14,class:"small"},g);t.textContent=i}
    if(STOPS[i]!=null){
      const up=y>165;const t=el("text",{x,y:up?y+52:y-36,"text-anchor":"middle","font-size":i===0||i===GOAL?22:18,class:"place"},svg);
      t.textContent=STOPS[i];
      if(i===GOAL){const s=el("text",{x,y:y+7,"text-anchor":"middle","font-size":20},g);s.textContent="★"}
    }
  });
  const tok=el("g",{id:"token"},svg);
  el("circle",{cx:0,cy:0,r:17,fill:"var(--red)",stroke:"#fff","stroke-width":3},tok);
  const t=el("text",{x:0,y:5,"text-anchor":"middle","font-size":13,"font-weight":900,fill:"#fff","font-family":"Source Sans 3, sans-serif"},tok);t.textContent="GW";
  paintBoard();
}
function paintBoard(){
  pts.forEach((_,i)=>{
    const c=$("node"+i).querySelector("circle"),reached=i<=state.pos;
    c.setAttribute("fill",i===GOAL?"var(--brass)":reached?"var(--navy)":"var(--surface)");
    c.setAttribute("stroke",i===GOAL?"var(--brass)":"var(--navy)");
    const t=$("node"+i).querySelector("text.small");if(t)t.style.fill=reached?"#fff":"";
  });
  const [x,y]=pts[state.pos];$("token").setAttribute("transform",`translate(${x} ${y-24})`);
  $("token").style.transform=`translate(${x}px, ${y-24}px)`;
}
function stats(){
  $("space").textContent=`${state.pos} / ${GOAL}`;
  $("first").textContent=Object.values(state.first).filter(Boolean).length;
  $("back").textContent=state.back;
}
function nextIndex(){
  if(!state.deck.length){state.deck=state.missed.length?[...state.missed]:QS.map((_,i)=>i)}
  return state.deck[0];
}
function showQ(){
  stats();paintBoard();
  if(state.pos>=GOAL)return showEnd();
  const qi=nextIndex(),item=QS[qi],again=qi in state.first;
  const v=$("qView");v.hidden=false;$("endView").hidden=true;
  v.innerHTML=`<div class="q">
    <div class="meta"><span>Question ${qi+1}${again?" (try again)":""}</span><span class="tag">${esc(item.cat)}</span></div>
    ${item.excerpt?`<blockquote class="excerpt">${esc(item.excerpt.text)}<cite>${esc(item.excerpt.cite)}</cite></blockquote>`:""}
    <h2>${esc(item.q)}</h2>
    ${item.hint?`<p class="hint">${esc(item.hint)}</p>`:""}
    <div class="choices">${item.c.map((t,i)=>`<button class="choice" data-i="${i}"><span class="k">${LETTERS[i]}</span><span>${esc(t)}</span></button>`).join("")}</div>
    <div id="fb"></div>
    <button class="primary" id="next" hidden>Next question</button>
  </div>`;
  v.querySelector(".choices").addEventListener("click",e=>{
    const b=e.target.closest(".choice");if(!b||b.disabled)return;
    const picked=+b.dataset.i,ok=picked===item.a;
    v.querySelectorAll(".choice").forEach(c=>{const i=+c.dataset.i;c.disabled=true;if(i===item.a)c.classList.add("right");else if(i===picked)c.classList.add("wrong")});
    if(!(qi in state.first))state.first[qi]=ok;
    state.deck.shift();
    let msg;
    if(ok){state.pos++;msg=state.pos>=GOAL?"Correct! You reached Philadelphia!":"Correct! Move forward one space."}
    else{
      if(!state.missed.includes(qi))state.missed.push(qi);
      state.deck.push(qi);
      if(state.pos>0){state.pos--;state.back++;msg=`Not quite. The answer is ${LETTERS[item.a]}. Go back one space.`}
      else msg=`Not quite. The answer is ${LETTERS[item.a]}. You’ll see this question again.`;
    }
    save();stats();paintBoard();
    $("fb").innerHTML=`<div class="feedback ${ok?"ok":"no"}"><strong>${msg}</strong>${esc(item.why)}${ok?"":" This question will come back later."}</div>`;
    const n=$("next");n.hidden=false;n.textContent=state.pos>=GOAL?"See my results":"Next question";n.focus();
  });
  $("next").addEventListener("click",showQ);
  v.querySelector(".choice").focus();
}
function showEnd(){
  $("qView").hidden=true;const e=$("endView");e.hidden=false;
  const right=Object.values(state.first).filter(Boolean).length;
  const missed=state.missed.slice().sort((a,b)=>a-b);
  e.innerHTML=`<h2>You made it to Philadelphia!</h2>
    <p>You got ${right} of 16 questions right on the first try and were sent back ${state.back} ${state.back===1?"time":"times"}.</p>
    <button class="primary" id="again">Race again</button>
    ${missed.length?`<div class="review"><h3>Questions to review</h3><ol>${missed.map(i=>`<li value="${i+1}">${esc(QS[i].q)}<br><span class="ans">Answer: ${esc(QS[i].c[QS[i].a])}</span><br><span class="why">${esc(QS[i].why)}</span></li>`).join("")}</ol></div>`:""}`;
  $("again").addEventListener("click",reset);
}
function reset(){state=fresh();save();showQ()}
$("restart").addEventListener("click",()=>{if(state.pos===0&&!Object.keys(state.first).length||confirm("Start over? Your progress will be cleared."))reset()});
buildBoard();showQ();
</script>
</body>
</html>
